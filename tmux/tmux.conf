# secondary prefix so both work
set -g prefix2 C-a
bind C-a send-prefix -2

set -g mouse on

# Click on window names in status bar to switch windows
bind -T root MouseDown1Status select-window -t =
bind -T root MouseDown1StatusDefault select-window -t =
set -g @scroll-sppeed-nu-lines-per-scroll 1


# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"


# display
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off


# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind BTab switch-client -l  # move to last session

# split current window horizontally
bind - split-window -v
# split current window vertically
bind _ split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind + run "cut -c3- '#{TMUX_CONF}' | sh -s _maximize_pane '#{session_name}' '#D'"

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
unbind p
bind -r C-h previous-window                             # select previous window
bind -r C-l next-window                                 # select next window
bind -r C-S-H swap-window -t -1 \; select-window -t -1  # swap current window with the previous one
bind -r C-S-L swap-window -t +1 \; select-window -t +1  # swap current window with the next one
bind Tab last-window                                    # move to last active window


bind Enter copy-mode # enter copy mode



# set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"
set -as terminal-features 'xterm-kitty:RGB'

# allow focus events to get through to applications running in tmux
set -g focus-events on

# -- buffers -------------------------------------------------------------------

bind b list-buffers     # list paste buffers
bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from


# -- Design -------------------------------------------------------------------

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black bg=#DF87A9'

# panes
set -g pane-border-style 'fg=green'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#DF87A9'

set -g status-left '#{?client_prefix,#[fg=green],#[fg=#DF87A9]} '
#set -g status-left-length 10


set -g status-right-style 'fg=black bg=yellow'
set -g status-right ''
set -g status-right-length 0

setw -g window-status-current-style 'fg=black bg=#DF87A9'
setw -g window-status-current-format '#[bg=terminal fg=#DF87A9]#[range=window|#{window_index}]#[bg=#DF87A9 fg=black]#I #W #F#[norange]#[bg=terminal fg=#DF87A9]#[bg=#DF87A9 fg=black]'

setw -g window-status-style 'fg=#DF87A9'
setw -g window-status-separator ''
setw -g window-status-format '#[range=window|#{window_index}] #I #[fg=white]#W #[fg=yellow]#F #[norange]'

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=terminal bold'
